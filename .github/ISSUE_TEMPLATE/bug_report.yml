name: Bug Report
description: Create a report to help us improve MCP Forge
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue! Please check existing issues before submitting.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions or paste a minimal OpenAPI specification.
      placeholder: |
        1. Ingest OpenAPI file ...
        2. Run 'forge check' or click 'Generate'
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - CLI (forge)
        - Web UI (Frontend)
        - Backend REST API
        - Parser / Normalizer
        - Generated Runtime / Server
        - Playground
    validations:
      required: true
