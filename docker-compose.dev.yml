services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - ./backend:/app
      - forge_dev_data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENV=development
      - FORGE_MODE=local
      - FORGE_HOST=0.0.0.0
      - FORGE_PORT=8080
      - FORGE_DATA_DIR=/app/data
      - PLAYGROUND_ENABLED=true
    command: ["uv", "run", "uvicorn", "mcp_forge.api.app:create_app", "--factory", "--reload", "--host", "0.0.0.0", "--port", "8080"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    command: ["pnpm", "dev"]

volumes:
  forge_dev_data:
